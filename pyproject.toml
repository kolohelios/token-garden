[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "token-garden"
version = "0.1.0"
description = "Local saved Pi token usage readout and terminal popup for Herdr"
readme = "README.md"
authors = [{ name = "kolohelios" }]
keywords = ["pi", "herdr", "tokens", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "build==1.4.0",
  "setuptools==82.0.1",
  "twine==6.2.0",
]

[project.scripts]
token-garden = "garden.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["garden"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["garden"]

[tool.coverage.report]
fail_under = 90
show_missing = true
