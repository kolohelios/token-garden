# Merge these entries into your existing config; do not replace it.
# Requires a running collector. Both commands deliberately use absolute paths.

[ui]
tab_bar_right = [
  { type = "command", command = "sh /absolute/path/to/token-garden/garden.sh status --width 94", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

# Check your current shortcuts before assigning this one.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "sh /absolute/path/to/token-garden/garden.sh ui"
description = "open token garden"
width = "80%"
height = "80%"
